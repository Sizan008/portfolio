<section class="bg-slate-50 px-4 py-20 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-5xl">
    <app-section-title
      eyebrow="Education"
      title="Academic background"
      description="My academic journey in Software Engineering and previous educational qualifications."
    />

    <div class="relative mt-10 space-y-6">
      <div class="absolute bottom-6 left-[19px] top-6 hidden w-px bg-blue-200 sm:block"></div>

      @for (item of education; track item.id; let i = $index) {
        <article
          data-aos="fade-up"
          [attr.data-aos-delay]="i * 100"
          class="education-timeline-card relative rounded-3xl border border-slate-200 bg-white p-6 shadow-sm sm:ml-14 sm:p-8"
        >
          <span class="absolute -left-[46px] top-8 hidden h-4 w-4 rounded-full border-4 border-white bg-blue-600 shadow sm:block"></span>

          <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
            <div class="min-w-0">
              <h2 class="text-xl font-black text-slate-950 sm:text-2xl">
                {{ item.qualification }}
              </h2>

              <p class="mt-2 text-base font-bold text-slate-700 sm:text-lg">
                {{ item.institution }}
              </p>

              <p class="mt-3 text-sm font-bold text-blue-600 sm:text-base">
                {{ item.result }}
              </p>
            </div>

            <span class="w-fit shrink-0 rounded-full bg-blue-50 px-4 py-2 text-sm font-black text-blue-700">
              {{ item.year }}
            </span>
          </div>
        </article>
      }
    </div>
  </div>
</section>
