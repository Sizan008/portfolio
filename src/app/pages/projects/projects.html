<section class="bg-slate-50 px-4 py-20 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-7xl">
    <app-section-title
      eyebrow="Projects"
      title="My selected projects"
      description="A collection of projects showing frontend development, backend development, clean architecture, and deployment experience."
    />

    <div class="grid auto-rows-fr grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-3">
      @for (project of projects; track project.id) {
        <app-project-card [project]="project" />
      }
    </div>
  </div>
</section>
