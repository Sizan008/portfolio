<section class="bg-slate-50 px-4 py-20 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-7xl">
    <app-section-title
      eyebrow="Education"
      title="Academic journey"
      description="A short overview of my current university study and previous academic qualifications."
    />

    <div class="grid grid-cols-1 gap-5 md:grid-cols-3">
      @for (item of education; track item.id; let i = $index) {
        <article
          data-aos="fade-up"
          [attr.data-aos-delay]="i * 90"
          class="education-card relative overflow-hidden rounded-3xl border border-slate-200 bg-white p-6 shadow-sm"
        >
          <div class="mb-5 flex items-center justify-between gap-4">
            <span class="flex h-11 w-11 items-center justify-center rounded-2xl bg-blue-600 text-sm font-black text-white">
              0{{ i + 1 }}
            </span>

            <span class="rounded-full bg-blue-50 px-3 py-1.5 text-xs font-black text-blue-700">
              {{ item.year }}
            </span>
          </div>

          <h3 class="text-lg font-black leading-7 text-slate-950">
            {{ item.qualification }}
          </h3>

          <p class="mt-3 text-sm font-semibold leading-6 text-slate-600">
            {{ item.institution }}
          </p>

          <p class="mt-4 text-sm font-black text-blue-600">
            {{ item.result }}
          </p>
        </article>
      }
    </div>

    <div class="mt-10 text-center" data-aos="fade-up">
      <a
        routerLink="/education"
        class="inline-flex rounded-full bg-slate-950 px-7 py-3 text-sm font-black text-white transition hover:-translate-y-0.5 hover:bg-slate-800"
      >
        View Education Details
      </a>
    </div>
  </div>
</section>
