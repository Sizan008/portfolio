<section class="contact-bg px-4 py-20 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-4xl rounded-[2rem] bg-slate-950 p-8 text-center text-white sm:p-12">
    <p class="text-sm font-bold uppercase tracking-[0.25em] text-blue-300">
      Contact
    </p>

    <h2 class="mt-4 text-3xl font-black sm:text-4xl">
      Let’s build something professional
    </h2>

    <p class="mx-auto mt-4 max-w-2xl text-base leading-7 text-slate-300">
      I am open to internship, junior frontend developer roles, freelance work,
      and collaboration opportunities.
    </p>

    <div class="mt-8 flex flex-col justify-center gap-4 sm:flex-row">
      <a
        [href]="'mailto:' + profile.email"
        class="rounded-full bg-white px-7 py-3 text-sm font-black text-slate-950 transition hover:bg-blue-50"
      >
        Send Email
      </a>

      <a
        routerLink="/contact"
        class="rounded-full border border-white/30 px-7 py-3 text-sm font-black text-white transition hover:bg-white/10"
      >
        Contact Page
      </a>
    </div>
  </div>
</section>
