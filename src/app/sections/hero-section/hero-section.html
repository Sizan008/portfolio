<section class="hero-bg min-h-[calc(100vh-73px)] px-4 py-16 sm:px-6 lg:px-8">
  <div class="mx-auto grid max-w-7xl grid-cols-1 items-center gap-12 lg:grid-cols-2">
    <div class="text-center lg:text-left">
      <p class="text-sm font-bold uppercase tracking-[0.3em] text-blue-600">
        Hello, I am
      </p>

      <h1 class="mt-4 text-4xl font-black leading-tight text-slate-950 sm:text-5xl lg:text-6xl">
        {{ profile.fullName }}
      </h1>

      <h2 class="mt-4 text-2xl font-bold text-blue-600 sm:text-3xl">
        {{ profile.title }}
      </h2>

      <p class="mx-auto mt-6 max-w-2xl text-base leading-8 text-slate-600 sm:text-lg lg:mx-0">
        {{ profile.summary }}
      </p>

      <div class="mt-8 flex flex-col justify-center gap-4 sm:flex-row lg:justify-start">
        <a
          routerLink="/projects"
          class="rounded-full bg-blue-600 px-7 py-3 text-center text-sm font-black text-white transition hover:bg-blue-700"
        >
          View Projects
        </a>

        <a
          [href]="profile.resumeUrl"
          target="_blank"
          class="rounded-full border border-slate-300 bg-white px-7 py-3 text-center text-sm font-black text-slate-800 transition hover:border-blue-600 hover:text-blue-600"
        >
          Download Resume
        </a>
      </div>

      <div class="mt-7 flex flex-wrap justify-center gap-3 lg:justify-start">
        @for (link of socialLinks; track link.id) {
          <a
            [href]="link.url"
            target="_blank"
            rel="noopener"
            class="rounded-full bg-slate-100 px-4 py-2 text-sm font-bold text-slate-700 transition hover:bg-blue-50 hover:text-blue-600"
          >
            {{ link.label }}
          </a>
        }
      </div>
    </div>

    <div class="flex justify-center lg:justify-end">
      <div class="profile-frame">
        <img
  [src]="profile.profileImageUrl"
  [alt]="profile.fullName"
  class="h-full w-full object-contain"
/>
      </div>
    </div>
  </div>
</section>
