<div class="mx-auto mb-10 max-w-3xl text-center">
  @if (eyebrow()) {
    <p class="mb-3 text-sm font-bold uppercase tracking-[0.25em] text-blue-600">
      {{ eyebrow() }}
    </p>
  }

  <h2 class="text-3xl font-black text-slate-950 sm:text-4xl lg:text-5xl">
    {{ title() }}
  </h2>

  @if (description()) {
    <p class="mt-4 text-base leading-7 text-slate-600 sm:text-lg">
      {{ description() }}
    </p>
  }
</div>
